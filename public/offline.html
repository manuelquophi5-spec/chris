<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        padding-top: max(1.5rem, env(safe-area-inset-top));
        background: #f5f0e8;
        color: #1f1a17;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 24rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0;
        color: #5c534d;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        min-height: 44px;
        padding: 0 1.5rem;
        border: none;
        border-radius: 0.75rem;
        background: #01356e;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/ug-logo.png" alt="University of Ghana" width="96" height="96" style="border-radius: 0.75rem" />
      <h1>You're offline</h1>
      <p>
        This page needs an internet connection. Reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
